[project]
name = "reorder-hitl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "psycopg[binary]>=3.2",
  "fastapi>=0.141",
  "uvicorn>=0.30",
  "sse-starlette>=3.4",
  "openai>=3.19,<4",
  "pydantic>=2.7",
  "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.27", "pandas>=2.2", "openpyxl>=3.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
