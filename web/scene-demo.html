<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>재고 발주 결재실</title>
<style>html,body{margin:0;height:100%;background:#f6f2ea}canvas{width:100vw;height:100vh;display:block}</style></head>
<body><div style="position:fixed;top:0;left:0;right:0;padding:8px 16px;background:#fff3cd;color:#6b4e00;font:14px sans-serif;z-index:1">
⚠ 배치 확인용 데모(가짜 서류 10건) — 결재 패널이 없습니다. 결재는 <a href="/">메인 화면</a>에서 하세요.</div><canvas id="c"></canvas><script type="module">
import { preload, draw, fitView } from "./src/renderer.js";
import { Office } from "./src/office.js";
const c = document.getElementById("c"), office = new Office();
const r = await preload(); console.log("에셋", r); document.title = `missing=${r.missing}`;
// 데모: 가짜 이벤트 12건 (이 페이지는 Task 13 에서 실제 SSE 로 바뀐다)
for (let i = 0; i < 10; i++) {
  const code = "D" + i;
  office.push({ type: "judged", code, analyst: i % 3, name: ["재즈 하트 주소록", "빈티지 레드 머그", "LED 야간등"][i % 3],
                qty: [30, 10, 220][i % 3], signal: ["급증", "평소", "증가"][i % 3], reason: "최근 8주 평균 판매량이 약 12개이나 지난 2주 동안 판매가 줄어 다음 주에도 감소가 예상되어 평소보다 적게 들인다" });
  office.push(i % 3 === 0 ? { type: "queued", code, flags: ["C2"], texts: ["발주량 30개 = 8주 평균의 2.1배 > 2배"] } : { type: "sent", code, by: "auto" });
}
if (location.hash.includes("skip")) office.skip();
let grid = location.hash.includes("grid");
addEventListener("keydown", e => { if (e.key === "g" || e.key === "G") grid = !grid; });
let last = performance.now();
(function loop(t) { office.tick(t - last); last = t; draw(c, { ...fitView(c), frame: office.frame(), grid, props: !location.hash.includes("empty") }); requestAnimationFrame(loop); })(last);
</script></body></html>
